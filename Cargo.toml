[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kjpopov/testls"
authors = ["Krasimir Popov"]

[workspace.dependencies]
testls-wire = { path = "crates/testls-wire" }
testls-data = { path = "crates/testls-data" }
testls-probe = { path = "crates/testls-probe" }
testls-checks = { path = "crates/testls-checks" }
testls-report = { path = "crates/testls-report" }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
tokio = { version = "1.47", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
