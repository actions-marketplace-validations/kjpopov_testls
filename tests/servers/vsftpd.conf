# vsftpd for the FTP STARTTLS (AUTH TLS) integration test. vsftpd refuses
# to start with every login type off, so local logins are on, but the image
# has no accounts with passwords and anonymous access is off.
listen=YES
background=NO
anonymous_enable=NO
local_enable=YES
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pasv_enable=NO
ssl_enable=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=NO
rsa_cert_file=/etc/vsftpd/server.pem
rsa_private_key_file=/etc/vsftpd/server.key
xferlog_enable=NO
vsftpd_log_file=/dev/stdout
