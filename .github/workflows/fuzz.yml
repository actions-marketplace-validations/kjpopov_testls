name: Fuzz

on:
  push:
    branches: [main, develop]
    paths: ["crates/testls-wire/**", "fuzz/**", ".github/workflows/fuzz.yml"]
  pull_request:
    paths: ["crates/testls-wire/**", "fuzz/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [record_stream, server_hello, certificate_list, ssl2_server_hello]
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      # One minute per target on pushes and PRs, ten on the weekly run.
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - name: Fuzz
        working-directory: fuzz
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time="$SECONDS_PER_TARGET"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
