name: zizmor

on:
  push:
    branches: [main, develop]
    paths: [".github/**"]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for relevant changes
        id: changes
        # Pull requests always run this job so it can be a required check, but
        # skip the audit unless they change .github/. Pushes always audit.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^\.github/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # Findings fail the job directly; no SARIF upload, so no
      # security-events permission is needed.
      - if: steps.changes.outputs.run == 'true'
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
