name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="testls-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/testls.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/testls" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  # Multi-arch image from the released musl binaries. The Dockerfile only
  # copies files, so no emulation is needed for the arm64 image.
  container:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-unknown-linux-musl"
          path: dist
          merge-multiple: true
      - name: Unpack binaries
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            name="testls-${GITHUB_REF_NAME}-${pair#*:}-unknown-linux-musl"
            tar xzf "dist/$name.tar.gz" -C dist
            mkdir -p "context/$arch"
            cp "dist/$name/testls" "context/$arch/testls"
          done
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          tags=(--tag "$image:$version")
          if [[ "$version" != *-* ]]; then
            tags+=(--tag "$image:${version%.*}" --tag "$image:latest")
          fi
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file packaging/container/Dockerfile "${tags[@]}" --push context
          docker logout ghcr.io

  # Trusted publishing needs crates that already exist, so the job stays off
  # until the maintainer has published once and sets the repository variable
  # CRATES_IO_TRUSTED_PUBLISHING to "true" (docs/agent-workflow.md, Releases).
  crates-io:
    needs: publish
    if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Crates already on crates.io at this version are excluded, so rerunning
      # the job after a partial publish uploads only the remaining ones.
      - name: Publish crates not yet on crates.io
        run: |
          crates=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          exclude=()
          while read -r name version; do
            status=$(curl -sS --connect-timeout 20 --max-time 60 -o /dev/null -w '%{http_code}' \
              -A "testls release workflow (https://github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version already published"; exclude+=(--exclude "$name") ;;
              404) ;;
              *) echo "::error::crates.io returned $status for $name $version"; exit 1 ;;
            esac
          done <<< "$crates"
          if (( ${#exclude[@]} / 2 == $(wc -l <<< "$crates") )); then
            echo "every crate is already published"
            exit 0
          fi
          cargo publish --workspace --locked "${exclude[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
