name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseded pull request runs are cancelled. Branch runs get a group of
  # their own, so a newer push never cancels a queued run on main.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate OCSP test fixtures
        shell: bash
        run: scripts/gen-ocsp-fixtures.sh
      - run: docker compose -f tests/servers/compose.yaml up -d --build
      - name: Run unit and integration tests with coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info -- --include-ignored
      - name: Write the summary
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
      - if: always()
        run: docker compose -f tests/servers/compose.yaml down

  # The upload runs in its own job so the Codecov token (environment
  # `codecov`) is never present while the tests run code from the pull
  # request. Fork pull requests get no secrets and upload tokenless.
  upload:
    needs: coverage
    runs-on: ubuntu-latest
    environment: codecov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
