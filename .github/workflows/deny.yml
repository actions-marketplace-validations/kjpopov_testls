name: cargo-deny

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # New RustSec advisories appear without code changes; check daily.
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A freshly published advisory should not block unrelated pull requests;
    # it still fails the scheduled and main-branch runs.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
      # The fuzz crate is a separate workspace with its own lockfile. It is a
      # second step rather than a matrix entry so the required check names stay.
      - if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check ${{ matrix.checks }}
