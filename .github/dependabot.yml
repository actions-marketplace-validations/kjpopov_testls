# Weekly version updates. Security updates are enabled separately in the
# repository settings and are not limited by this schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Patch and minor bumps land together; majors get their own PR.
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /tests/servers
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "test"
