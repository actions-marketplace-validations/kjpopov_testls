# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Fail on RustSec vulnerabilities, unmaintained and unsound crates, and yanked
# versions. Add an `ignore` entry (with a reason) only for advisories that do
# not affect testls.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences compatible with shipping testls as MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # webpki-roots ships the Mozilla root list under CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# libfuzzer-sys (fuzz/ only) bundles LLVM's libFuzzer under the permissive
# NCSA licence; it is never linked into testls itself.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
